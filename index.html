<!DOCTYPE html>
<html lang="es">
<!-- Inicio de la configuracion de la pagina -->
<head>
	<meta charset="UTF-8">

	<!-- Inicio de los estilos de la pagina -->
	<style>
		/* Estilo general del cuerpo de la pagina */
		body {
			margin: 0;
			padding: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		/* Estilo de la parte de arriba con el titulo */
		header {
			background-color: #4a2e56;
			color: white;
			text-align: center;
			padding: 20px;
			width: 100%;
			box-sizing: border-box;
		}

		/* Estilo de la barra de menu */
		nav {
			background-color: #333;
			padding: 12px;
			text-align: center;
			width: 100%;
			box-sizing: border-box;
		}

		/* Estilo de los enlaces del menu */
		nav a {
			color: white;
			margin: 0 15px;
			text-decoration: none;
			font-weight: bold;
		}

		/* Estilo de la caja del contenido central */
		.contenido-principal {
			margin: auto;
			padding: 20px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 30px;
			max-width: 800px;
		}

		/* Estilo del espacio para el texto de bienvenida */
		.texto {
			text-align: left;
			flex: 1;
		}

		/* Estilo del espacio para la imagen */
		.imagen {
			flex: 1;
			text-align: center;
		}

		/* Estilo de la imagen para que se adapte al tamaño */
		.imagen img {
			max-width: 100%;
			height: auto;
		}

		/* Estilo de la parte de abajo de la pagina */
		footer {
			background-color: #333;
			color: white;
			text-align: center;
			padding: 15px;
			width: 100%;
			box-sizing: border-box;
		}
	</style>
	<!-- Fin de los estilos de la pagina -->
</head>
<!-- Fin de la configuracion de la pagina -->

<!-- Inicio del contenido visible de la pagina -->
<body>

	<!-- Seccion del titulo principal -->
	<header>
		<h1>Kuromi's Shop</h1>
	</header>

	<!-- Seccion del menu de navegacion -->
	<nav>
		<a href="index.html">Inicio</a>
		<a href="articulos.html">Articulos</a>
		<a href="iniciosesion.html">Inicio de sesión</a>
		<a href="registro.html">Registro</a>
	</nav>

	<!-- Seccion principal de bienvenida -->
	<div class="contenido-principal">
		<!-- Seccion del texto -->
		<div class="texto">
			<h1>¡¡Bienvenid@ a Kuromi's Shop!!</h1>
			<p>Aquí podrás encontrar articulos muy lindos y malvados para ir a la moda jsjsjs.</p>
		</div>

		<!-- Seccion de la imagen -->
		<div class="imagen">
			<img src="kuromifresa.jpg"Imagen de muestra">
		</div>
	</div>
	<!-- Fin de la seccion principal de bienvenida -->

	<!-- Seccion del pie de pagina -->
	<footer>
		<p>| Andrea Franco Enriquez | 0541 | 5°I |</p>
	</footer>

</body>
<!-- Fin del contenido visible de la pagina -->
</html>
